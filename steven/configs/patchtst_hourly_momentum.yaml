seed: 42
device: auto  # auto | cpu | mps | cuda
data_path: steven/data/spy_ohlcv_1h.parquet

# Same architecture/loss/train recipe as configs/patchtst.yaml, unchanged -- only the input
# features change (EMA9/EMA21+RSI14+VIX added, see src/momentum_pipeline.py), matching
# cvae_hourly_momentum.yaml so both models see identical input data.
momentum_features:
  enabled: true
  vix_data_path: steven/data/vix_daily_yfinance.parquet

model:
  d_model: 64
  nhead: 4
  num_layers: 3
  dim_feedforward: 128
  dropout: 0.1

loss:
  w_price: 1.0
  w_vol: 0.5

train:
  max_epochs: 20
  train_windows_per_epoch: 20000
  windows_per_eval_set: 3000
  batch_size: 512
  lr: 0.0006
  weight_decay: 0.0001
  num_workers: 0
  pin_memory: true

output:
  checkpoint_path: steven/outputs/patchtst_checkpoint.pt
