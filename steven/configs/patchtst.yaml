seed: 42
device: auto  # auto | cpu | mps | cuda
data_path: steven/data/spy_ohlcv_1h.parquet

model:
  # See docs/experiments.md -- HF PatchTSTModel-backed (src/models/patchtst_hf.py),
  # not the original hand-rolled patchtst.py. channel_attention=False is the main
  # approach for now: it beat channel_attention=True on volume RMSE stability
  # (True showed a heavy-tailed outlier failure mode) despite True's slight edge on
  # OHLC/Dir Acc. Override with --channel-attention / --no-channel-attention.
  d_model: 64
  num_attention_heads: 4
  num_hidden_layers: 3
  dropout: 0.1
  head_dropout: 0.0
  channel_attention: false
  patch_length: 7
  patch_stride: 7

loss:
  w_price: 1.0
  w_vol: 0.5

train:
  max_epochs: 20
  train_windows_per_epoch: 20000
  windows_per_eval_set: 3000
  # batch_size/lr bumped for an A100 -- window tensors are tiny (73x9), plenty of headroom.
  # num_workers stays 0: benchmarked locally, and DataLoader multiprocessing is *slower*
  # here (0.6s/epoch at num_workers=0 vs 33s/epoch at num_workers=4, same window count) --
  # build_window() is a handful of cheap numpy ops per sample, so worker spawn/IPC
  # overhead (paid every epoch, since train_ds is rebuilt fresh each epoch) dominates.
  batch_size: 512
  lr: 0.0006          # modest bump for the 8x batch size increase (Adam, not full linear scaling)
  weight_decay: 0.0001
  num_workers: 0
  pin_memory: true    # still worth it for the host->device copy, independent of num_workers

output:
  # Renamed from patchtst_checkpoint.pt -- that file is the original hand-rolled
  # patchtst.py's checkpoint (steven's own architecture); this one is the HF-backed
  # replacement, incompatible state_dict, kept as a separate file rather than
  # overwriting his.
  checkpoint_path: steven/outputs/patchtst_hf_checkpoint.pt
