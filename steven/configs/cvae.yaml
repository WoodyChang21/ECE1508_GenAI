seed: 42
device: auto  # auto | cpu | mps | cuda
data_path: steven/data/spy_ohlcv_1h.parquet

model:
  hidden: 32
  ctx_dim: 64
  z_dim: 16
  decoder_hidden: 128

loss:
  w_price: 1.0
  w_vol: 0.5
  kl_anneal_epochs: 5
  free_bits: 0.05

train:
  max_epochs: 30
  train_windows_per_epoch: 20000
  windows_per_eval_set: 3000
  # see patchtst.yaml's train: comment -- same A100 rationale (and num_workers=0 finding) applies here.
  batch_size: 512
  lr: 0.0006
  weight_decay: 0.0001
  num_workers: 0
  pin_memory: true

inference:
  num_samples: 5

output:
  checkpoint_path: steven/outputs/cvae_checkpoint.pt
