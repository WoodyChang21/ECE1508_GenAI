seed: 42
device: auto  # auto | cpu | mps | cuda
data_path: steven/data/spy_ohlcv_1h.parquet

model:
  hidden: 32
  ctx_dim: 64
  z_dim: 8  # was 16 -- concentrate the KL budget into fewer, denser dims (see backlog.md)
  decoder_hidden: 128
  ctx_dropout: 0.3  # new -- weakens the decoder's direct context bypass (see backlog.md)
  # new -- permanent, deterministic bottleneck on the decoder's OWN view of context (the
  # prior still sees the full ctx_dim=64). An 8x reduction, matching z_dim, so the decoder
  # can't cheaply reconstruct fine detail from context alone and has to lean on z instead.
  # The architectural lever from backlog.md's CVAE posterior-collapse entry, tried after
  # ctx_dropout alone (stochastic, training-only) wasn't enough to fix direction collapse
  # (see cvae_direction_collapse.md).
  decoder_ctx_dim: 8

loss:
  w_price: 1.0
  w_vol: 0.5
  # was a single 0->1 ramp over 5 epochs then flat at 1.0 for the rest -- cyclical
  # annealing instead (Fu et al. 2019): 3 cycles across training, each ramping 0->1 over
  # its first half then holding, so the decoder gets repeated chances to learn to use z
  # instead of just one. See kl_beta_schedule in train_cvae.py.
  kl_cycles: 3
  kl_ramp_fraction: 0.5
  free_bits: 0.15  # was 0.05 -- same idea as z_dim: force more real signal per dim, not more dims

train:
  max_epochs: 30
  train_windows_per_epoch: 20000
  windows_per_eval_set: 3000
  # see patchtst.yaml's train: comment -- same A100 rationale (and num_workers=0 finding) applies here.
  batch_size: 512
  lr: 0.0006
  weight_decay: 0.0001
  num_workers: 0
  pin_memory: true

inference:
  num_samples: 5

output:
  checkpoint_path: steven/outputs/cvae_checkpoint.pt
